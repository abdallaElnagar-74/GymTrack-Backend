services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gymapp
    ports:
      - "5432:5432"
    volumes:
      - gymdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gymapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    profiles: ["full"] # start with: docker compose --profile full up -d
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gym:gym@db:5432/gymapp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32chars}
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  gymdata:

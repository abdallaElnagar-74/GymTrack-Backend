# Local MongoDB for development and tests. Production uses MongoDB Atlas (set MONGODB_URI).
# It runs as a single-node replica set because the API uses transactions.
services:
  db:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initialise the replica set on first start, then report healthy once it has a primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; db.hello().isWritablePrimary || quit(1)",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    build: .
    profiles: ["full"] # start with: docker compose --profile full up -d
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://db:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: gymapp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32chars}
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  mongodata:

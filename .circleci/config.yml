version: 2.1

# Backend CI: typecheck, run integration tests against a real MongoDB, build the Docker image.
jobs:
  backend-test:
    docker:
      - image: cimg/node:22.12
        environment:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
          MONGODB_DB: gymapp_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
          PORT: 4000
      # Single-node replica set: the API uses transactions.
      - image: mongo:8
        command: ["--replSet", "rs0", "--bind_ip_all"]
    steps:
      - checkout
      - restore_cache:
          keys:
            - backend-deps-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: backend-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Wait for MongoDB and initialise the replica set
          command: |
            dockerize -wait tcp://localhost:27017 -timeout 1m
            node -e "
              const { MongoClient } = require('mongodb');
              (async () => {
                const c = await MongoClient.connect('mongodb://localhost:27017/?directConnection=true');
                await c.db('admin').command({ replSetInitiate: { _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] } });
                for (let i = 0; i < 60 && !(await c.db('admin').command({ hello: 1 })).isWritablePrimary; i++) await new Promise((r) => setTimeout(r, 500));
                await c.close();
              })().catch((e) => { console.error(e); process.exit(1); });
            "
      - run:
          name: Create .env for scripts that use --env-file
          command: printf 'MONGODB_URI=%s\nMONGODB_DB=%s\nJWT_SECRET=%s\nPORT=%s\n' "$MONGODB_URI" "$MONGODB_DB" "$JWT_SECRET" "$PORT" > .env
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-docker:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build API image
          command: docker build -t gymapp-backend:${CIRCLE_SHA1} .

  backend-deploy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger Render deploy
          command: |
            if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
              echo "RENDER_DEPLOY_HOOK_URL is not set in CircleCI project settings"; exit 1
            fi
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

workflows:
  backend:
    jobs:
      - backend-test
      - backend-docker:
          requires:
            - backend-test
      - backend-deploy:
          requires:
            - backend-docker
          filters:
            branches:
              only: main
